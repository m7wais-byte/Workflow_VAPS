@page{size:297mm 420mm;margin:0}
:root{--paper:#F8F4EA;--navy:#0B2545;--navy2:#13355F;--gold:#B8892B;--gold2:#D9B25A;--ink:#1B2433;--mut:#465063;--hair:#D9CDB0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:297mm;height:420mm}

.page{position:relative;width:297mm;height:420mm;overflow:hidden;display:flex;flex-direction:column;align-items:center;

.ltr{direction:ltr;unicode-bidi:isolate;font-family:'IBM Plex Sans',sans-serif}
.frame{position:absolute;inset:10mm;border:.45mm solid var(--gold);pointer-events:none}
.frame::before{content:"";position:absolute;inset:1.8mm;border:.18mm solid var(--gold2)}
.frame svg{position:absolute;width:9mm;height:9mm}
.frame .a{top:-4.5mm;right:-4.5mm}.frame .b{top:-4.5mm;left:-4.5mm}.frame .c{bottom:-4.5mm;right:-4.5mm}.frame .d{bottom:-4.5mm;left:-4.5mm}
.logo{margin-top:22mm}
.title-f{font-family:'Noto Kufi Arabic',sans-serif}
.orn{display:flex;align-items:center;justify-content:center;gap:2.2mm}
.orn b{height:.35mm;width:28mm;background:linear-gradient(270deg,transparent,var(--gold))}

.foot .ft b{color:var(--navy);font-weight:600}
.key{position:absolute;left:50%;transform:translateX(-50%);width:11mm;height:11mm;z-index:3}.key svg{width:100%;height:100%;filter:drop-shadow(0 .4mm .6mm rgba(0,0,0,.15))}
.logo img{height:36mm;display:block}
.archwrap{position:relative;margin-top:11mm}

.atext{position:absolute;left:0;right:0;bottom:15mm;text-align:center;color:#fff}
.kick{display:inline-block;font-size:12pt;font-weight:600;color:#E6C16A;border:.3mm solid rgba(230,193,106,.5);border-radius:10mm;padding:1.2mm 6mm}
.h1{font-family:'Noto Kufi Arabic';font-weight:800;font-size:45pt;line-height:1.45;margin-top:3mm}
.gt{color:#EBC872}

.atext .orn{margin-top:5mm}.atext .orn b{width:22mm}
