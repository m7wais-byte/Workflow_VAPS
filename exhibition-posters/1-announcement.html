@page{size:297mm 420mm;margin:0}

.frame{position:absolute;inset:10mm;border:.45mm solid var(--gold);pointer-events:none}

.logo{margin-top:22mm}

.logo img{height:36mm;display:block}

.gt{color:#EBC872}
