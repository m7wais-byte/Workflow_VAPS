html,body{width:297mm;height:420mm}

.page{position:relative;width:297mm;height:420mm;overflow:hidden;display:flex;flex-direction:column;align-items:center;
 background:radial-gradient(60% 35% at 50% 8%,#FFFDF7 0%,transparent 70%),radial-gradient(80% 40% at 50% 100%,#EFE6D2 0%,transparent 70%),var(--paper)}

.frame svg{position:absolute;width:9mm;height:9mm}
.frame .a{top:-4.5mm;right:-4.5mm}.frame .b{top:-4.5mm;left:-4.5mm}.frame .c{bottom:-4.5mm;right:-4.5mm}.frame .d{bottom:-4.5mm;left:-4.5mm}
.logo{margin-top:22mm}
.title-f{font-family:'Noto Kufi Arabic',sans-serif}
.orn{display:flex;align-items:center;justify-content:center;gap:2.2mm}
.orn b{height:.35mm;width:28mm;background:linear-gradient(270deg,transparent,var(--gold))}

.orn i{width:2.2mm;height:2.2mm;background:var(--gold);transform:rotate(45deg)}

.logo img{height:42mm;display:block}
.archwrap{position:relative;margin-top:14mm}
.archwrap .key{top:-5.5mm}
.atext{position:absolute;left:0;right:0;bottom:17mm;text-align:center;color:#fff}
.kick{display:inline-block;font-size:12pt;font-weight:600;color:#E6C16A;border:.3mm solid rgba(230,193,106,.5);border-radius:10mm;padding:1.2mm 6mm}
.h1{font-family:'Noto Kufi Arabic';font-weight:800;font-size:40pt;line-height:1.45;margin-top:3mm}

.atext .orn{margin-top:5mm}.atext .orn b{width:22mm}
.info{display:flex;align-items:stretch;justify-content:center;margin-top:16mm}
.base{width:236mm;height:.5mm;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin-top:-0.3mm}
.info .it{text-align:center;padding:0 10mm}
.info .it small{display:block;font-size:11pt;color:var(--gold);font-weight:600;letter-spacing:1px;margin-bottom:2mm}
.info .it b{font-size:17pt;color:var(--navy);font-weight:700;white-space:nowrap}
.info .sep{width:.3mm;background:linear-gradient(transparent,var(--gold),transparent)}
.org{margin-top:auto;margin-bottom:26mm;text-align:center}
.org small{display:block;font-size:11pt;color:var(--mut);letter-spacing:1px}
