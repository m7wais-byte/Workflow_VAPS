.atext{position:absolute;left:0;right:0;bottom:17mm;text-align:center;color:#fff}

.soon{font-family:'Noto Kufi Arabic';font-weight:800;font-size:86pt;line-height:1.25;color:#EBC872;margin-top:1mm}

.when .orn{margin:6mm 0 3mm}
.when .o{font-size:11pt;color:var(--mut)}.when .o strong{color:var(--navy);font-weight:600}
